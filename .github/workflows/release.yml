name: Build and Release Axiom
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python build.py
      - run: |
          echo "Built dist/Axiom.lua"
          ls -lh dist/
          wc -c dist/Axiom.lua
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Axiom.lua
          generate_release_notes: true
