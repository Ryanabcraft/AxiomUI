name: Build and Release Axiom
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python build.py
      - run: git diff --exit-code -- dist/Axiom.lua
      - run: python validate_public.py
      - run: python -m unittest mcp.test_server
      - uses: actions/upload-artifact@v4
        with:
          name: Axiom-${{ github.sha }}
          path: dist/Axiom.lua

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Axiom-${{ github.sha }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Axiom.lua
          generate_release_notes: true
